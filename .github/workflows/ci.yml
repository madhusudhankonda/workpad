name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate:release
      - run: sh scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: workpad-extension
          path: |
            dist
            workpad-*.zip

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>Workpad billing</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f6ff; color: #292936; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .card { width: min(100%, 460px); padding: 34px; border: 1px solid #ddd8f3; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(48, 39, 103, .12); text-align: center; }
      .mark { display: grid; place-items: center; width: 50px; height: 50px; margin: 0 auto 18px; border-radius: 14px; background: linear-gradient(135deg, #7465e7, #5140b2); color: #fff; font-size: 24px; }
      h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.04em; }
      p { margin: 0; color: #6f7080; line-height: 1.6; }
      .hint { margin-top: 20px; padding-top: 18px; border-top: 1px solid #eceaf5; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" id="mark">✓</div>
      <h1 id="title">Workpad Pro is being activated</h1>
      <p id="message">Your payment was received. Return to Workpad and reopen Settings; activation normally appears within a few seconds.</p>
      <p class="hint">You can close this tab and return to the Workpad side panel.</p>
    </main>
    <script>
      const billingOutcome = new URLSearchParams(location.search).get("billing");
      if (billingOutcome === "cancelled") {
        document.title = "Workpad checkout cancelled";
        document.getElementById("mark").textContent = "×";
        document.getElementById("title").textContent = "Checkout cancelled";
        document.getElementById("message").textContent = "Nothing was charged. You can return to Workpad whenever you are ready.";
      } else if (billingOutcome !== "success") {
        document.title = "Workpad billing updated";
        document.getElementById("mark").textContent = "←";
        document.getElementById("title").textContent = "Return to Workpad";
        document.getElementById("message").textContent = "Your billing changes have been saved. Return to Workpad and reopen Settings to refresh your plan.";
      }
    </script>
  </body>
</html>

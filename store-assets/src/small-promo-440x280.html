<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(circle at 85% 15%, #8a94f5 0%, transparent 45%), linear-gradient(145deg, #5e69df 0%, #5b4bc2 100%); }
  .wrap { padding: 34px 36px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; margin: -8px; }
  .brand span { font-size: 30px; font-weight: 750; letter-spacing: -.5px; }
  h1 { margin: 26px 0 0; font-size: 31px; line-height: 1.12; font-weight: 750; letter-spacing: -.6px; }
  p { margin: 14px 0 0; font-size: 15px; line-height: 1.4; color: #e4e6ff; }
  .cite { display: inline-block; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.22); font-size: 13px; font-weight: 650; vertical-align: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="../icon-128.png" alt=""><span>Workpad</span></div>
    <h1>Ask any page.<br>Get cited answers. <span class="cite">P2</span></h1>
    <p>AI research assistant in Chrome's side panel.</p>
  </div>
</body>
</html>

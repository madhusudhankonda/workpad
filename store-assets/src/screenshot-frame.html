<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
    background: radial-gradient(circle at 15% 0%, #8a94f5 0%, transparent 45%), linear-gradient(145deg, #5e69df 0%, #5b4bc2 100%); }
  .copy { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 380px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 750; }
  .brand img { width: 56px; height: 56px; margin: -9px; }
  h1 { margin: 34px 0 0; font-size: 44px; line-height: 1.1; font-weight: 780; letter-spacing: -1px; }
  p { margin: 20px 0 0; font-size: 20px; line-height: 1.45; color: #e4e6ff; }
  .stage { position: absolute; left: 500px; right: 48px; top: 48px; bottom: 48px; display: flex; align-items: center; justify-content: center; }
  .shot { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 30px 70px rgba(25, 18, 80, .45); background: #fff; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../icon-128.png" alt="">Workpad</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <div class="stage"><img class="shot" id="shot" alt=""></div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("title").textContent = params.get("title") ?? "";
    document.getElementById("subtitle").textContent = params.get("subtitle") ?? "";
    document.getElementById("shot").src = params.get("image") ?? "";
  </script>
</body>
</html>
